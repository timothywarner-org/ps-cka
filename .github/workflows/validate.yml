name: Content Validation

# No paths: filter on purpose. The proprietary-content guard below must run on
# EVERY push and PR -- with a paths filter, a commit adding only a .pptx would
# never trigger this workflow, which is exactly the case the guard exists for.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            !cka-cert-buddy/**
            !notebooks/**
            !**/temp/**

      - name: Guard against proprietary work product
        run: |
          echo "Checking for slide decks, outlines, or VM images that must not be committed..."
          BINARY=$(git ls-files | grep -iE '\.(pptx|potx|ppt|docx|doc|vhd|vhdx|avhdx|vmcx|vmrs|vsv|vmdk|ova|iso|box)$' || true)

          # Internal recording/production artifacts. These are MARKDOWN, so the
          # extension check above cannot see them. DECK-CORRECTIONS.md reached
          # the public repo with CI green precisely because of this gap.
          INTERNAL=$(git ls-files | grep -iE '(-talk-track\.md|-standards-check\.md|-clip-titles[^/]*\.md|DECK-CORRECTIONS\.md|-SUPERSEDED\.)' || true)

          FAIL=0
          if [ -n "$BINARY" ]; then
            echo "::error::Proprietary or binary lab artifacts are tracked. Remove them and add to .gitignore:"
            echo "$BINARY"
            FAIL=1
          fi
          if [ -n "$INTERNAL" ]; then
            echo "::error::Internal recording artifacts are tracked (talk tracks, clip titles, standards checks, deck corrections). These must never be public:"
            echo "$INTERNAL"
            FAIL=1
          fi
          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          echo "No proprietary work product tracked. Good."

      - name: Check for em dashes and curly quotes
        continue-on-error: true
        run: |
          echo "Checking for curly quotes, em dashes, and en dashes in Markdown..."
          RESULTS=$(grep -rn --include="*.md" -P '[\x{2018}\x{2019}\x{201C}\x{201D}\x{2013}\x{2014}]' . || true)
          if [ -n "$RESULTS" ]; then
            echo "::warning::Non-ASCII punctuation found (curly quotes or dashes). Prefer straight quotes and hyphens:"
            echo "$RESULTS"
          else
            echo "No curly quotes or dashes found."
          fi

      - name: Validate Markdown links
        continue-on-error: true
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          config-file: ".github/workflows/mlc-config.json"
